<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">NVIDIA Coding Agent Lab</title>
<desc id="d">Banner: the lab's architecture in miniature (Zed and OpenCode, the free NVIDIA API, the NVIDIA docs MCP servers, vLLM serving Nemotron 3 on Modal GPUs, the InfiniBand lab and the on-prem target) next to the project title and its technologies.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b100d"/><stop offset="0.55" stop-color="#0f1712"/><stop offset="1" stop-color="#132211"/></linearGradient>
<radialGradient id="glow" cx="0.76" cy="0.5" r="0.45"><stop offset="0" stop-color="#76b900" stop-opacity="0.28"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.38" stop-color="#fff" stop-opacity="0"/><stop offset="0.78" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="gridmask"><rect width="1280" height="400" fill="url(#fade)"/></mask>
<marker id="a-inf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fd16e"/></marker>
<marker id="a-mcp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f5a742"/></marker>
<marker id="a-on" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3cc4a2"/></marker>
<style>
text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.kicker { font-size: 15px; font-weight: 700; letter-spacing: 0.22em; fill: #76b900; }
.title { font-size: 54px; font-weight: 700; fill: #f0f6ec; }
.accent { fill: #8fd400; }
.tag { font-size: 21px; fill: #a3ada6; }
.chip { font-size: 14px; font-weight: 600; fill: #e6ece7; }
.stat { font-size: 15px; fill: #8b968f; }
.grid line { stroke: #24302a; stroke-width: 1; }
.node rect { fill: #101812; stroke-width: 2; }
.nt { font-size: 15px; font-weight: 700; fill: #e9efe9; }
.ns { font-size: 12px; fill: #98a39c; font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
.flow { fill: none; stroke-width: 2.4; stroke-dasharray: 7 7; animation: march 1.1s linear infinite; }
.rdma { stroke-width: 6; stroke-dasharray: none; stroke-linecap: round; animation: none; }
.lbl { font-size: 12px; font-weight: 700; fill: #a98bfa; font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
@keyframes march { to { stroke-dashoffset: -14; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>
</defs>

<rect width="1280" height="400" fill="url(#bg)"/>
<rect width="1280" height="400" fill="url(#glow)"/>
<g class="grid" mask="url(#gridmask)">
  <line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="120" x2="1280" y2="120"/>
  <line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/>
  <line x1="0" y1="280" x2="1280" y2="280"/><line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="360" x2="1280" y2="360"/>
  <line x1="760" y1="0" x2="760" y2="400"/><line x1="800" y1="0" x2="800" y2="400"/><line x1="840" y1="0" x2="840" y2="400"/>
  <line x1="880" y1="0" x2="880" y2="400"/><line x1="920" y1="0" x2="920" y2="400"/><line x1="960" y1="0" x2="960" y2="400"/>
  <line x1="1000" y1="0" x2="1000" y2="400"/><line x1="1040" y1="0" x2="1040" y2="400"/><line x1="1080" y1="0" x2="1080" y2="400"/>
  <line x1="1120" y1="0" x2="1120" y2="400"/><line x1="1160" y1="0" x2="1160" y2="400"/><line x1="1200" y1="0" x2="1200" y2="400"/>
  <line x1="1240" y1="0" x2="1240" y2="400"/>
</g>

<!-- Title block -->
<text class="kicker" x="64" y="98">NEMOTRON · vLLM · MODAL · ON-PREM</text>
<text class="title" x="62" y="162"><tspan class="accent">NVIDIA</tspan> Coding Agent Lab</text>
<text class="tag" x="64" y="208">Nemotron served with vLLM on Modal serverless GPUs,</text>
<text class="tag" x="64" y="236">wired into Zed and OpenCode, ready to move on-prem.</text>

<g transform="translate(64 266)">
  <rect x="0" y="0" width="186" height="34" rx="17" fill="#76b900" fill-opacity="0.16" stroke="#76b900" stroke-opacity="0.7"/>
  <text class="chip" x="93" y="22" text-anchor="middle">Nemotron 3 Super · Ultra</text>
  <rect x="196" y="0" width="94" height="34" rx="17" fill="#6a9cf5" fill-opacity="0.14" stroke="#6a9cf5" stroke-opacity="0.7"/>
  <text class="chip" x="243" y="22" text-anchor="middle">vLLM 0.28</text>
  <rect x="300" y="0" width="76" height="34" rx="17" fill="#b7c1ba" fill-opacity="0.12" stroke="#b7c1ba" stroke-opacity="0.6"/>
  <text class="chip" x="338" y="22" text-anchor="middle">Modal</text>
  <rect x="386" y="0" width="146" height="34" rx="17" fill="#f5a742" fill-opacity="0.14" stroke="#f5a742" stroke-opacity="0.7"/>
  <text class="chip" x="459" y="22" text-anchor="middle">NVIDIA docs MCP</text>
  <rect x="542" y="0" width="140" height="34" rx="17" fill="#a98bfa" fill-opacity="0.14" stroke="#a98bfa" stroke-opacity="0.7"/>
  <text class="chip" x="612" y="22" text-anchor="middle">InfiniBand RDMA</text>
</g>

<text class="stat" x="64" y="346">~88 tok/s on 1× RTX PRO 6000  ·  ~$3/h, scales to zero  ·  API key on every route</text>

<!-- Architecture in miniature: same flow colours as the animated page -->
<path class="flow" d="M972 77 H1066" stroke="#5fd16e" marker-end="url(#a-inf)"/>
<path class="flow" d="M972 92 H1040 V153 H1066" stroke="#f5a742" marker-end="url(#a-mcp)"/>
<path class="flow" d="M892 102 V152" stroke="#5fd16e" marker-end="url(#a-inf)"/>
<path class="flow" d="M1052 220 H1160 V294" stroke="#3cc4a2" marker-end="url(#a-on)"/>
<path class="flow rdma" d="M906 268 V294" stroke="#a98bfa"/>
<text class="lbl" x="920" y="286">RDMA 3,200 Gb/s</text>

<g class="node">
  <rect x="812" y="52" width="160" height="50" rx="12" stroke="#6f9bf0"/>
  <text class="nt" x="828" y="76">Zed · OpenCode</text>
  <text class="ns" x="828" y="93">your editor</text>
</g>
<g class="node">
  <rect x="1072" y="52" width="176" height="50" rx="12" stroke="#8ccb2a"/>
  <text class="nt" x="1088" y="76">NVIDIA API</text>
  <text class="ns" x="1088" y="93">free tier · daily use</text>
</g>
<g class="node">
  <rect x="1072" y="128" width="176" height="50" rx="12" stroke="#f0a23a"/>
  <text class="nt" x="1088" y="152">NVIDIA docs MCP</text>
  <text class="ns" x="1088" y="169">CUDA · Dynamo · AIPerf</text>
</g>
<g class="node">
  <rect x="812" y="158" width="240" height="104" rx="14" stroke="#76b900" stroke-width="2.5"/>
  <text class="nt" x="830" y="186">vLLM · Nemotron 3</text>
  <text class="ns" x="830" y="206">Modal · scales to zero</text>
  <text class="ns" x="830" y="223">RTX PRO 6000 · B200</text>
  <text class="ns" x="830" y="240">key on every route</text>
  <!-- GPU chip -->
  <g transform="translate(1004 176)" fill="none" stroke="#76b900" stroke-width="1.6">
    <rect x="0" y="0" width="34" height="34" rx="4" fill="#76b900" fill-opacity="0.15"/>
    <rect x="9" y="9" width="16" height="16" rx="2" fill="#76b900" fill-opacity="0.45"/>
    <path d="M7 0 V-5 M17 0 V-5 M27 0 V-5 M7 34 V39 M17 34 V39 M27 34 V39 M0 7 H-5 M0 17 H-5 M0 27 H-5 M34 7 H39 M34 17 H39 M34 27 H39"/>
  </g>
</g>
<g class="node">
  <rect x="812" y="300" width="200" height="50" rx="12" stroke="#a687f2"/>
  <text class="nt" x="828" y="324">InfiniBand lab</text>
  <text class="ns" x="828" y="341">2 × 8 H200 · RDMA</text>
</g>
<g class="node">
  <rect x="1072" y="300" width="176" height="50" rx="12" stroke="#3cc4a2"/>
  <text class="nt" x="1088" y="324">On-prem</text>
  <text class="ns" x="1088" y="341">compose · k8s · Dynamo</text>
</g>
</svg>
