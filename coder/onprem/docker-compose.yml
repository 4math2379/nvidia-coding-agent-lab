# The same coder endpoint as coder/serve.py (tier super-rtx / super-b200), on a machine you own.
#
# Needs: NVIDIA driver >= 575, Docker + NVIDIA Container Toolkit, one Blackwell GPU with >= 96 GB
# (RTX PRO 6000, B200, GB10/DGX Spark). On Hopper use the FP8 checkpoint with TP=4 instead.
#
#   export HF_TOKEN=hf_xxx NEMOTRON_API_KEY=$(openssl rand -hex 32)
#   docker compose -f coder/onprem/docker-compose.yml up -d
#   CODER_URL=http://localhost:8000 python coder/client.py
#
# Air-gapped: pull the image and run `huggingface-cli download` once on a connected machine, copy
# the image (docker save/load or a local registry) and the hf-cache volume, then set HF_HUB_OFFLINE=1.

services:
  vllm:
    image: vllm/vllm-openai:v0.28.0-ubuntu2404
    restart: unless-stopped
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      VLLM_API_KEY: ${NEMOTRON_API_KEY:?set NEMOTRON_API_KEY}
      VLLM_FLOAT32_MATMUL_PRECISION: high
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      SAFETENSORS_FAST_GPU: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
      - --served-model-name=nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
      - --host=0.0.0.0
      - --port=8000
      - --trust-remote-code
      - --tensor-parallel-size=1
      - --max-model-len=262144
      - --gpu-memory-utilization=0.92
      - --max-num-seqs=8
      - --max-num-batched-tokens=16384
      - --kv-cache-dtype=fp8
      - --mamba-cache-mode=align
      - --mamba-ssm-cache-dtype=float32
      - --speculative-config={"method":"mtp","num_speculative_tokens":3}
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --reasoning-parser=nemotron_v3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder

volumes:
  hf-cache:
  vllm-cache:
